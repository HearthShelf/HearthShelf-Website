# Cloudflare Pages configuration
name = "hearthshelf-website"
compatibility_date = "2024-01-01"
pages_build_output_dir = "dist"

# Build-time environment variables. When a wrangler.toml is present, CF Pages
# reads build config from here, so the dashboard "Variables and secrets" panel
# does NOT feed the Vite build - these [vars] do. Vite inlines VITE_* at build
# time.
#
# The identity-provider keys that used to live here are GONE ON PURPOSE.
# HearthShelf accounts moved to its own auth service, but this site kept
# shipping the old provider's key, so "Sign up" here still opened the old
# provider's form - and an account created there could not sign in to the app
# at all. With no key, every auth control falls back to linking into
# app.hearthshelf.com, which is where accounts are actually made.
[vars]

# D1 database backing the changelog API (functions/api). After creating it with
#   wrangler d1 create hearthshelf-changelog
# paste the returned database_id below, then apply migrations with
#   wrangler d1 migrations apply hearthshelf-changelog --remote
# The CI upload secret CHANGELOG_API_KEY is set out-of-band (dashboard or
#   wrangler pages secret put CHANGELOG_API_KEY) and must never be committed.
[[d1_databases]]
binding = "DB"
database_name = "hearthshelf-changelog"
database_id = "e3e0dcc6-5b97-4c52-937e-2ca4aa4880eb"
migrations_dir = "migrations"
